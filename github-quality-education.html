<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quality Education — EdTech Platform</title>
<style>


@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#11212D; --slate:#5A6B78; --mute:#8A99A3; --line:#DCE4E4;
  --canvas:#EDF2F0; --card:#FFFFFF; --teal:#0E7C6B; --tealSoft:#E2F0EC;
  --marigold:#F5A524; --marigoldSoft:#FDF1D9; --vermilion:#C6362F; --redSoft:#FBE7E5;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:var(--canvas);font-family:var(--body);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

.mono{font-family:var(--mono)}
.display{font-family:var(--display)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.eyebrow.teal{color:var(--teal)}
.muted{color:var(--slate);font-size:14px}
.small{font-size:12px;color:var(--slate);font-family:var(--mono)}

.shell{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:236px;flex-shrink:0;background:var(--ink);padding:16px;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:8px 8px 0}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--marigold);display:grid;place-items:center;color:var(--ink)}
.brand h1{font-family:var(--display);font-size:14px;font-weight:800;color:#fff;line-height:1.2}
.brand p{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#7D94A0}
.nav{margin-top:28px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#9FB3BD;font-size:14px;border-left:2px solid transparent;text-align:left;width:100%}
.nav button.on{background:rgba(255,255,255,.10);color:#fff;border-left-color:var(--marigold)}
.whoami{margin-top:auto;background:rgba(255,255,255,.06);border-radius:12px;padding:12px}
.whoami .n{color:#fff;font-size:14px;font-weight:500;margin-top:4px}
.whoami .m{color:#9FB3BD;font-size:12px}

.main{flex:1;min-width:0}
header.top{position:sticky;top:0;z-index:30;background:rgba(237,242,240,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:10px;padding:12px 24px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.search input{border:none;background:none;outline:none;width:100%;font-size:14px;color:var(--ink)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px}
.seg button{padding:6px 10px;border-radius:9px;font-size:12px;color:var(--slate)}
.seg button.on{background:var(--ink);color:#fff}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;position:relative;display:grid;place-items:center}
.dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:99px;background:var(--vermilion)}
.roles{display:flex;align-items:center;gap:8px;padding:0 24px 12px;overflow-x:auto}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--slate);border-radius:99px;padding:6px 14px;font-size:12px}
.chip.on{background:var(--tealSoft);border-color:var(--teal);color:var(--teal)}
.burger{display:none}
.mobnav{display:none;background:var(--ink);padding:12px;border-top:1px solid rgba(255,255,255,.08)}

main{padding:24px}
.pagehead{margin-bottom:20px}
.pagehead h2{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.p20{padding:20px}.p24{padding:24px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
.cards3{display:grid;gap:16px;grid-template-columns:repeat(3,1fr)}
.cards4{display:grid;gap:16px;grid-template-columns:repeat(4,1fr)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.wrap{display:flex;flex-wrap:wrap;gap:12px}
.mt4{margin-top:4px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;transition:transform .18s ease,background .18s ease}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:none}
.btn.solid{background:var(--ink);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}

.tile{background:var(--canvas);border-radius:12px;padding:16px}
.tile .v{font-family:var(--display);font-size:26px;font-weight:800;margin-top:4px}
.tile .n{font-size:12px;color:var(--slate)}

.hero{background-image:repeating-linear-gradient(var(--canvas) 0 1px,transparent 1px 28px)}
.ribbonwrap{overflow-x:auto}
.ribbon{min-width:620px}
.ticks{position:relative;height:20px}
.ticks span{position:absolute;top:0;font-family:var(--mono);font-size:11px;color:var(--mute)}
.track{position:relative;background:var(--canvas);border-radius:12px;padding:10px 0}
.slots{position:relative;height:118px}
.slot{position:absolute;height:52px;border-radius:9px;padding:7px 10px;overflow:hidden;transition:transform .18s ease}
.slot:hover{transform:translateY(-2px)}
.slot .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.slot .t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--vermilion);z-index:5}
.now i{position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:99px;background:var(--vermilion);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.listrow{display:flex;align-items:center;gap:16px;background:var(--canvas);border-radius:12px;padding:12px;transition:transform .18s ease}
.listrow:hover{transform:translateY(-2px)}
.thumb{width:44px;height:44px;border-radius:10px;background:var(--ink);display:grid;place-items:center;color:#fff;flex-shrink:0}
.bar{height:6px;background:var(--canvas);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.spine{display:flex;align-items:center;gap:12px}
.spine .lbl{width:140px;flex-shrink:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg12{display:flex;gap:4px;flex:1}
.seg12 i{height:20px;flex:1;border-radius:3px;background:var(--canvas)}
.streak{display:flex;gap:3px;margin-top:12px}
.streak i{height:24px;flex:1;border-radius:3px;background:var(--tealSoft)}

.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-size:14px;transition:transform .15s ease}
.opt:hover{transform:translateY(-1px)}
.opt.on{border-color:var(--ink);background:var(--canvas)}
.opt.right{border-color:var(--teal);background:var(--tealSoft)}
.opt.wrong{border-color:var(--vermilion);background:var(--redSoft)}
.key{width:24px;height:24px;border-radius:7px;background:var(--canvas);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--slate);flex-shrink:0}
.steps{display:flex;gap:4px;margin-top:12px}
.steps i{height:4px;flex:1;border-radius:99px;background:var(--canvas)}
.steps i.on{background:var(--ink)}

.divide>*+*{border-top:1px solid var(--line)}
.attend{display:flex;flex-wrap:wrap;gap:4px;margin-top:20px}
.attend i{width:16px;height:16px;border-radius:3px;background:var(--tealSoft)}
.note{background:var(--marigoldSoft);border-left:3px solid var(--marigold);border-radius:12px;padding:16px;font-size:14px}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.player{background:var(--ink);height:250px;display:grid;place-items:center;position:relative;border-radius:16px 16px 0 0}
.livetag{position:absolute;left:16px;top:16px;background:var(--vermilion);color:#fff;border-radius:99px;padding:4px 12px;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px}
.livetag i{width:7px;height:7px;border-radius:99px;background:#fff;animation:pulse 2.4s ease-in-out infinite}
footer.legal{display:flex;flex-wrap:wrap;gap:16px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.rise{animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#C9D4D4;border-radius:99px}

@media (max-width:1080px){
  .g3,.g2,.g4{grid-template-columns:1fr}
  .cards3,.cards4{grid-template-columns:1fr 1fr}
  .side{display:none}
  .burger{display:grid;place-items:center}
  .mobnav.open{display:block}
  .search{display:none}
  main{padding:16px}
  .toprow,.roles{padding-left:16px;padding-right:16px}
  .pagehead h2{font-size:24px}
}
@media (max-width:620px){
  .cards3,.cards4{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ─────────── chart helpers ─────────── */
function ring(v,size,label){
  const r=size/2-7, circ=2*Math.PI*r;
  return '<div style="position:relative;width:'+size+'px;height:'+size+'px;flex-shrink:0">'+
    '<svg width="'+size+'" height="'+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--canvas)" stroke-width="7"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--teal)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-v/100))+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
    '</svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'+
    '<span class="display" style="font-size:'+(size>100?24:19)+'px;font-weight:800">'+v+'%</span>'+
    (label?'<span class="mono" style="font-size:10px;color:var(--mute)">'+label+'</span>':'')+'</div></div>';
}
function areaChart(data){
  const W=560,H=210,L=36,R=10,Tp=12,B=26, max=130;
  const x=i=>L+(i*(W-L-R))/(data.length-1), y=v=>Tp+(1-v/max)*(H-Tp-B);
  const pts=data.map((d,i)=>x(i)+','+y(d.v)).join(' ');
  let g=''; [0,65,130].forEach(v=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--canvas)"/><text x="4" y="'+(y(v)+4)+'" font-size="11" fill="var(--slate)">'+v+'</text>';});
  let lb=data.map((d,i)=>'<text x="'+x(i)+'" y="'+(H-6)+'" font-size="11" fill="var(--slate)" text-anchor="middle">'+d.d+'</text>').join('');
  let dots=data.map((d,i)=>'<circle cx="'+x(i)+'" cy="'+y(d.v)+'" r="3.5" fill="var(--teal)"/>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="220" preserveAspectRatio="none">'+
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0E7C6B" stop-opacity=".30"/><stop offset="100%" stop-color="#0E7C6B" stop-opacity="0"/></linearGradient></defs>'+
    g+'<polygon points="'+L+','+(H-B)+' '+pts+' '+(W-R)+','+(H-B)+'" fill="url(#ag)"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round"/>'+dots+lb+'</svg>';
}
function radar(data){
  const cx=130,cy=125,rad=82;
  const pt=(i,f)=>{const a=(-90+i*(360/data.length))*Math.PI/180;return [cx+Math.cos(a)*rad*f, cy+Math.sin(a)*rad*f];};
  let rings=''; [.33,.66,1].forEach(f=>{
    rings+='<polygon points="'+data.map((_,i)=>pt(i,f).join(',')).join(' ')+'" fill="none" stroke="var(--line)"/>';});
  let axes=data.map((_,i)=>{const p=pt(i,1);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--line)"/>';}).join('');
  const shape=data.map((d,i)=>pt(i,d.v/100).join(',')).join(' ');
  let labels=data.map((d,i)=>{const p=pt(i,1.24);return '<text x="'+p[0]+'" y="'+(p[1]+4)+'" font-size="10.5" fill="var(--slate)" text-anchor="middle">'+d.k+'</text>';}).join('');
  return '<svg viewBox="0 0 260 250" width="100%" height="230">'+rings+axes+
    '<polygon points="'+shape+'" fill="#0E7C6B" fill-opacity=".22" stroke="var(--teal)" stroke-width="2"/>'+labels+'</svg>';
}
function bars(data){
  return '<div style="display:flex;align-items:flex-end;gap:16px;height:190px;padding-top:10px">'+
    data.map(d=>'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end">'+
      '<span class="mono" style="font-size:12px">'+d.v+'</span>'+
      '<div style="width:100%;background:var(--teal);border-radius:7px 7px 0 0;height:'+(d.v/100*130)+'px"></div>'+
      '<span class="small">'+d.t+'</span></div>').join('')+'</div>';
}

const card=(inner,cls)=>'<section class="card '+(cls||'p20')+'">'+inner+'</section>';
const eyebrow=(t,c)=>'<div class="eyebrow'+(c?' '+c:'')+'">'+t+'</div>';
const btn=(label,kind,icon,attrs)=>'<button class="btn '+(kind||'solid')+'" '+(attrs||'')+'>'+(icon?I[icon](16):'')+'<span>'+label+'</span></button>';

function ribbon(){
  const t=T(), now=new Date();
  const h=Math.min(17,Math.max(7,now.getHours()+now.getMinutes()/60));
  const pct=x=>((x-7)/10)*100;
  let slots=SCHEDULE.map((s,i)=>{const k=KIND[s.k];
    return '<div class="slot" title="'+s.t+' · '+s.by+'" style="left:'+pct(s.s)+'%;width:'+(pct(s.e)-pct(s.s))+'%;top:'+((i%2)*60)+'px;background:'+k.bg+';border-left:3px solid '+k.bar+'">'+
      '<div class="k" style="color:'+k.bar+'">'+k.tag+'</div><div class="t">'+s.t+'</div></div>';}).join('');
  let ticks=[7,9,11,13,15,17].map(x=>'<span style="left:'+pct(x)+'%">'+(x>12?(x-12)+' pm':x+' am')+'</span>').join('');
  return '<div class="between" style="align-items:flex-end;margin-bottom:12px"><div>'+eyebrow(t.day)+
    '<h3 class="display" style="font-size:22px;font-weight:800;margin-top:4px">Six sessions, 4h 20m of scheduled learning</h3></div>'+
    '<div class="small">'+now.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"})+'</div></div>'+
    '<div class="ribbonwrap"><div class="ribbon"><div class="ticks">'+ticks+'</div>'+
    '<div class="track"><div class="now" style="left:'+pct(h)+'%"><i></i></div><div class="slots">'+slots+'</div></div></div></div>';
}
function spine(list){
  return (list||SUBJECTS).map(s=>{
    let segs=''; const filled=Math.round(s.m/100*12);
    for(let i=0;i<12;i++) segs+='<i style="background:'+(i<filled?s.h:'var(--canvas)')+'"></i>';
    return '<div class="spine"><div class="lbl">'+s.n+'</div><div class="seg12">'+segs+'</div>'+
      '<div class="small" style="width:56px;text-align:right">'+s.d+'/'+s.c+'</div></div>';
  }).join('');
}

  const board=LEADERS.map(l=>'<div class="row" style="padding:12px '+(l.me?'10px':'0')+';'+(l.me?'background:var(--tealSoft);border-radius:10px;':'')+'">'+
    '<span class="display" style="width:24px;font-size:18px;font-weight:800;color:'+(l.r<=3?'var(--marigold)':'var(--mute)')+'">'+l.r+'</span>'+
    '<div style="flex:1"><div style="font-size:14px;font-weight:500">'+l.n+(l.me?' <span style="color:var(--teal)">· you</span>':'')+'</div>'+
    '<div class="small">Class '+l.c+'</div></div><span class="mono" style="font-size:14px">'+l.p.toLocaleString('en-IN')+'</span></div>').join('');
  const mile=[["cap","STEM Merit Scholarship","Applications open until 20 Sept · you qualify","var(--marigold)"],
    ["star","100 lessons completed","Milestone reached on 12 August","var(--teal)"],
    ["trophy","District coding olympiad","Shortlisted · practice set assigned","var(--teal)"]]
    .map(m=>'<div class="row" style="align-items:flex-start;background:var(--canvas);border-left:3px solid '+m[3]+';border-radius:12px;padding:16px">'+
      '<span style="color:'+m[3]+'">'+I[m[0]](18)+'</span><div><div style="font-size:14px;font-weight:500">'+m[1]+'</div>'+
      '<div style="font-size:12px;color:var(--slate)">'+m[2]+'</div></div></div>').join('');
  return card('<div class="between" style="flex-wrap:wrap"><div>'+eyebrow('Recognition')+
      '<h3 class="display" style="font-size:24px;font-weight:800;margin-top:4px">4,655 points · rank 2 of 118 in Grade 8</h3>'+
      '<p class="muted mt4">165 points behind first place. Two more mock exams would close the gap.</p></div>'+
      btn('Download certificates','ghost','down')+'</div>','p24 rise')+
    '<div class="cards4 mt20">'+badges+'</div>'+
    '<div class="grid g2 mt20">'+
      card(eyebrow('Grade 8 leaderboard')+'<div class="divide mt12">'+board+'</div>')+
      card(eyebrow('Scholarships and milestones')+'<div class="stack mt12">'+mile+'</div>')+
    '</div>';
}

/* ─────────── shell ─────────── */
function navHTML(){
  const t=T();
  const items=[["home",t.home,"grid"],["learn",t.learn,"book"],["live",t.live,"radio"],
    ["assess",t.assess,"clip"],["progress",t.progress,"trend"],["awards",t.awards,"medal"]];
  return '<div class="nav">'+items.map(n=>'<button class="'+(state.view===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'+
    I[n[2]](18)+'<span>'+n[1]+'</span></button>').join('')+'</div>';
}
function title(){
  const t=T(), map={home:t.home,learn:t.learn,live:t.live,assess:t.assess,progress:t.progress,awards:t.awards};
  return state.view==="home" ? t.greet+", "+ME().who.split(" ")[0] : map[state.view];
}
function bodyHTML(){
  if(state.view==="home") return {student:studentHome,parent:parentHome,teacher:teacherHome,admin:adminHome}[state.role]();
  return {learn:learnView,live:liveView,assess:assessView,progress:progressView,awards:awardsView}[state.view]();
}
function render(){
  const t=T(), me=ME();
  const langs=[["en","EN"],["ta","தமிழ்"],["hi","हिं"]].map(l=>
    '<button class="'+(state.lang===l[0]?'on':'')+'" onclick="setLang(\''+l[0]+'\')">'+l[1]+'</button>').join('');
  const roles=ROLES.map(r=>'<button class="chip'+(state.role===r.id?' on':'')+'" onclick="setRole(\''+r.id+'\')">'+r.label+'</button>').join('');

  document.getElementById('app').innerHTML =
  '<div class="shell">'+
    '<aside class="side"><div class="brand"><div class="brand-mark">'+I.cap(18)+'</div>'+
      '<div><h1>Quality Education</h1><p>EDTECH PLATFORM</p></div></div>'+
      navHTML()+
      '<div class="whoami"><div class="eyebrow" style="color:#7D94A0">Signed in as</div>'+
      '<div class="n">'+me.who+'</div><div class="m">'+me.meta+'</div></div></aside>'+
    '<div class="main">'+
      '<header class="top"><div class="toprow">'+
        '<button class="iconbtn burger" onclick="toggleNav()">'+(state.navOpen?I.close(18):I.menu(18))+'</button>'+
        '<div class="search">'+I.search(16)+'<input placeholder="'+t.search+'" /></div>'+
        '<div class="seg">'+langs+'</div>'+
        '<button class="iconbtn">'+I.bell(16)+'<span class="dot"></span></button>'+
      '</div>'+
      '<div class="roles"><span class="eyebrow" style="flex-shrink:0">'+t.viewas+'</span>'+roles+'</div>'+
      '<div class="mobnav'+(state.navOpen?' open':'')+'">'+navHTML()+'</div>'+
      '</header>'+
      '<main><div class="pagehead">'+eyebrow(me.label+' workspace')+
        '<h2>'+title()+'</h2></div>'+bodyHTML()+
        '<footer class="legal">'+
        [["shield","Role-based access"],["globe","3 languages enabled"],["check","Works offline on mobile"]]
          .map(f=>'<div class="row" style="gap:6px;color:var(--mute)">'+I[f[0]](14)+'<span class="mono" style="font-size:11px">'+f[1]+'</span></div>').join('')+
        '</footer></main>'+
    '</div>'+
  '</div>';
}

/* ─────────── actions ─────────── */
function go(v){state.view=v;state.navOpen=false;render();window.scrollTo(0,0);}
function setRole(r){state.role=r;state.view="home";render();}
function setLang(l){state.lang=l;render();}
function setFilter(f){state.filter=f;render();}
function toggleNav(){state.navOpen=!state.navOpen;render();}
function pick(n){if(state.quiz.answers.length===state.quiz.i+1)return;state.quiz.picked=n;render();}
function checkQ(){const q=state.quiz;if(q.picked===null)return;q.answers.push(q.picked===QUIZ[q.i].a);render();}
function nextQ(){const q=state.quiz;q.picked=null;if(q.i+1<QUIZ.length)q.i++;else q.done=true;render();}
function resetQuiz(){state.quiz={i:0,picked:null,answers:[],done:false};render();}

render();
</script>
</body>
</html>
