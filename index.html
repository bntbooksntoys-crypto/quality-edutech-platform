/* ─────────── auth actions ─────────── */
function switchAuth(screen){state.auth={screen,error:'',loading:false};render();}

async function doSignIn(e){
  e.preventDefault();
  const email=document.getElementById('f_email').value.trim().toLowerCase();
  const password=document.getElementById('f_pass').value;
  state.auth.error=''; state.auth.loading=true; render();
  try {
    const pwHash = await sha256(password);
    const users = getUsers();
    const user = users.find(u=>u.email===email && u.passwordHash===pwHash);
    if(!user){ qeLog('failed',{email:email}); throw new Error('Incorrect email or password.'); }
    const userData = {name:user.name,email:user.email,grade:user.grade,age:user.age};
    localStorage.setItem('qe_token','local-'+Date.now());
    localStorage.setItem('qe_user',JSON.stringify(userData));
    state.user = userData; qeLog('signin',userData); setTimeout(qtBeat,50);
    const _gm1=String(userData.grade).match(/\d+/); state.libGrade=_gm1?parseInt(_gm1[0])||8:8;
    state.auth = {screen:'app',error:'',loading:false};
    render();
  } catch(err){
    state.auth.error = err.message;
    state.auth.loading = false;
    render();
  }
}

async function doSignUp(e){
  e.preventDefault();
  const name=document.getElementById('f_name').value.trim();
  const email=document.getElementById('f_email').value.trim().toLowerCase();
  const password=document.getElementById('f_pass').value;
  const grade=document.getElementById('f_grade').value;
  const age=document.getElementById('f_age').value;
  if(password.length<6){state.auth.error='Password must be at least 6 characters.';render();return;}
  state.auth.error=''; state.auth.loading=true; render();
  try {
    const users = getUsers();
    if(users.find(u=>u.email===email)) throw new Error('An account with this email already exists.');
    const pwHash = await sha256(password);
    users.push({name,email,passwordHash:pwHash,grade,age:Number(age),createdAt:new Date().toISOString()});
    saveUsers(users);
    const userData = {name,email,grade,age:Number(age)};
    localStorage.setItem('qe_token','local-'+Date.now());
    localStorage.setItem('qe_user',JSON.stringify(userData));
    state.user = userData; qeLog('signup',userData); setTimeout(qtBeat,50);
    const _gm2=String(grade).match(/\d+/); state.libGrade=_gm2?parseInt(_gm2[0])||8:8;
    state.auth = {screen:'app',error:'',loading:false};
    render();
  } catch(err){
    state.auth.error = err.message;
    state.auth.loading = false;
    render();
  }
}

function doSignOut(){
  qtEnd();
  qeLog('signout',state.user);
  localStorage.removeItem('qe_token');
  localStorage.removeItem('qe_user');
  state.user = null;
  state.auth = {screen:'signin',error:'',loading:false};
  render();
}

/* ─────────── Real activity tracking + Trend analysis ─────────── */
const QT_KEY='qe_activity', QT_TICK=5;
const QT_NAMES={home:'Home',learn:'Learn',live:'Live classes',assess:'Assignment',quiz:'Quiz',progress:'Progress Report',awards:'Achievements',lab:'Lab',ai:'AI Assistant'};
let qt={cur:null,lastSync:0};
function qtLoad(){try{const d=JSON.parse(localStorage.getItem(QT_KEY)||'null');if(d&&Array.isArray(d.s)&&d.f)return d;}catch(e){}return {s:[],f:{}};}
function qtStore(d){try{if(d.s.length>2000)d.s=d.s.slice(-2000);localStorage.setItem(QT_KEY,JSON.stringify(d));}catch(e){}}
function qtDay(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function qtUser(){return state.user&&state.auth.screen==='app'?String(state.user.email||'').toLowerCase():'';}
function qtSection(){
  if(state.view==='lab'&&state.labOpen){const l=(typeof LABS!=='undefined')&&LABS.find(x=>x.id===state.labOpen);return l?l.title:'Lab';}
  return QT_NAMES[state.view]||'Other';
}
function qtBeat(){
  const u=qtUser();if(!u){qt.cur=null;return;}
  if(document.visibilityState!=='visible')return;
  const d=qtLoad(),now=Date.now();
  if(!qt.cur||qt.cur.u!==u){qt.cur={id:now.toString(36)+Math.random().toString(36).slice(2,7),u:u,in:now,out:now};d.s.push(qt.cur);}
  else{const s=d.s.find(x=>x.id===qt.cur.id);if(s){s.out=now;qt.cur=s;}else{qt.cur.out=now;d.s.push(qt.cur);}
    const k=u+'|'+qtDay(now),sec=qtSection();d.f[k]=d.f[k]||{};d.f[k][sec]=(d.f[k][sec]||0)+QT_TICK;}
  qtStore(d);
  if(now-qt.lastSync>60000)qtSync();
}
function qtEnd(){const u=qtUser();if(qt.cur&&u){const d=qtLoad(),s=d.s.find(x=>x.id===qt.cur.id);if(s){s.out=Date.now();qtStore(d);}qtSync();}qt.cur=null;}
function qtSync(){
  qt.lastSync=Date.now();
  try{
    if(!qt.cur||!state.user)return;
    const d=qtLoad(),day=qtDay(Date.now()),s=d.s.find(x=>x.id===qt.cur.id)||qt.cur;
    const data={email:qt.cur.u,name:state.user.name||'',grade:state.user.grade||'',age:state.user.age||'',session:{id:s.id,in:s.in,out:s.out},date:day,focus:d.f[qt.cur.u+'|'+day]||{}};
    /* school server on the local network */
    if(/^(localhost|127\.|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname))
      fetch('/api/activity',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify(data)}).catch(function(){});
    /* Google Sheet for the weekly email report (set in report-config.js) */
    if(window.QE_REPORT_URL&&/^https:\/\/script\.google\.com\//.test(window.QE_REPORT_URL))
      fetch(window.QE_REPORT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},keepalive:true,body:JSON.stringify(Object.assign({key:window.QE_REPORT_KEY||''},data))}).catch(function(){});
  }catch(e){}
}
setInterval(qtBeat,QT_TICK*1000);
setTimeout(qtBeat,400);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')qtSync();else qtBeat();});
window.addEventListener('pagehide',qtSync);

/* ── Trend analysis (reads the real records above) ── */
let tr={range:'day',from:'',to:''};
function trRange(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),today=qtDay(n.getTime());
  if(tr.range==='month')return [qtDay(new Date(y,m,1).getTime()),today];
  if(tr.range==='year')return [y+'-01-01',today];
  if(tr.range==='custom'){let a=tr.from||today,b=tr.to||today;if(a>b){const t=a;a=b;b=t;}return [a,b];}
  return [today,today];
}
function trSet(r){tr.range=r;if(r==='custom'&&!tr.from){const t=qtDay(Date.now());tr.from=qtDay(Date.now()-6*864e5);tr.to=t;}render();}
function trDate(f,v){tr[f]=v;render();}
function trDur(sec){sec=Math.round(sec);if(sec<60)return sec+' s';const m=Math.round(sec/60);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min';}
function trClock(ts){return new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}
function trNice(day){const p=day.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString([], {day:'numeric',month:'short'});}
function trendHTML(){
  if(!state.user)return '';
  const u=String(state.user.email||'').toLowerCase(),d=qtLoad(),rg=trRange(),from=rg[0],to=rg[1];
  const ses=d.s.filter(s=>s.u===u&&qtDay(s.in)>=from&&qtDay(s.in)<=to).sort((a,b)=>b.in-a.in);
  const foc={},perDay={};
  Object.keys(d.f).forEach(k=>{const i=k.lastIndexOf('|'),ku=k.slice(0,i),day=k.slice(i+1);if(ku!==u||day<from||day>to)return;
    Object.keys(d.f[k]).forEach(sec=>{foc[sec]=(foc[sec]||0)+d.f[k][sec];perDay[day]=(perDay[day]||0)+d.f[k][sec];});});
  const total=Object.values(foc).reduce((a,b)=>a+b,0),secs=Object.keys(foc).sort((a,b)=>foc[b]-foc[a]);
  const avg=ses.length?ses.reduce((a,s)=>a+(s.out-s.in)/1000,0)/ses.length:0;
  const hrs=ses.map(s=>{const t=new Date(s.in);return t.getHours()*60+t.getMinutes();}).sort((a,b)=>a-b),med=hrs.length?hrs[Math.floor(hrs.length/2)]:null;
  const usual=med===null?'—':new Date(2000,0,1,Math.floor(med/60),med%60).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  const pill=(k,l)=>'<button class="tr-pill'+(tr.range===k?' on':'')+'" onclick="trSet(\''+k+'\')">'+l+'</button>';
  const tile=(v,l)=>'<div class="tr-tile"><b>'+v+'</b><span>'+l+'</span></div>';
  let h='<section class="tr-wrap"><div class="tr-head"><div>'+eyebrow('Real activity on this device')+'<h3 class="display" style="font-size:22px">Trend analysis</h3></div>'+
    '<div class="tr-filter" role="group" aria-label="Time range">'+pill('day','Today')+pill('month','This month')+pill('year','This year')+pill('custom','Custom')+
    (tr.range==='custom'?'<input type="date" aria-label="From date" value="'+tr.from+'" max="'+qtDay(Date.now())+'" onchange="trDate(\'from\',this.value)"><span class="muted">to</span><input type="date" aria-label="To date" value="'+tr.to+'" max="'+qtDay(Date.now())+'" onchange="trDate(\'to\',this.value)">':'')+'</div></div>'+
    '<div class="tr-tiles">'+tile(trDur(total),'Time in the app')+tile(ses.length,'Logins')+tile(ses.length?trDur(avg):'—','Average session')+tile(secs[0]||'—','Most focus')+tile(usual,'Usual login time')+'</div>';
  if(!ses.length&&!total)return h+'<div class="card tr-card"><p class="muted">No activity is recorded for this range yet. Keep using the app and it will appear here.</p></div></section>';
  /* use 1: login and logout */
  const days=[];ses.forEach(s=>{const dy=qtDay(s.in);if(days.indexOf(dy)<0)days.push(dy);});
  const rows=days.slice(0,14),RW=640,L=62,PW=RW-L-10,RH=22;
  let tl='<svg viewBox="0 0 '+RW+' '+(rows.length*RH+28)+'" class="tr-svg" role="img" aria-label="Login and logout times by day"><g font-size="10" fill="#5A6B78">';
  [0,6,12,18,24].forEach(hh=>{const x=L+hh/24*PW;tl+='<path d="M'+x+' 4V'+(rows.length*RH+6)+'" stroke="#E3E9EC"/><text x="'+x+'" y="'+(rows.length*RH+20)+'" text-anchor="middle">'+(hh===0||hh===24?'12 am':hh===12?'12 pm':hh<12?hh+' am':(hh-12)+' pm')+'</text>';});
  rows.forEach((dy,i)=>{const y=6+i*RH;tl+='<text x="'+(L-8)+'" y="'+(y+13)+'" text-anchor="end">'+trNice(dy)+'</text>';
    ses.filter(s=>qtDay(s.in)===dy).forEach(s=>{const a=new Date(s.in),b=new Date(Math.max(s.out,s.in)),x1=L+(a.getHours()*60+a.getMinutes())/1440*PW,e=qtDay(b.getTime())===dy?(b.getHours()*60+b.getMinutes())/1440:1,w=Math.max(4,L+e*PW-x1);
      tl+='<rect x="'+x1.toFixed(1)+'" y="'+(y+3)+'" width="'+w.toFixed(1)+'" height="'+(RH-8)+'" rx="4" fill="#0E7C6B"><title>'+trNice(dy)+': login '+trClock(s.in)+', logout '+trClock(s.out)+' ('+trDur((s.out-s.in)/1000)+')</title></rect>';});});
  tl+='</g></svg>';
  h+='<div class="tr-two"><div class="card tr-card"><h4>Login and logout times</h4><p class="muted tr-sub">Each bar runs from login to logout.'+(days.length>14?' Showing the latest 14 days.':'')+'</p>'+tl+
    '<div class="tr-tablewrap"><table class="tr-table"><thead><tr><th>Date</th><th>Login</th><th>Logout</th><th>Time spent</th></tr></thead><tbody>'+
    ses.slice(0,60).map(s=>'<tr><td>'+trNice(qtDay(s.in))+'</td><td>'+trClock(s.in)+'</td><td>'+(qt.cur&&qt.cur.id===s.id?'Active now':trClock(s.out))+'</td><td>'+trDur((s.out-s.in)/1000)+'</td></tr>').join('')+'</tbody></table></div></div>';
  /* use 2: focus */
  const mx=Math.max(1,...secs.map(s=>foc[s]));
  let bars='<div class="tr-bars" role="list">'+secs.map(s=>'<div class="tr-bar" role="listitem" title="'+s+': '+trDur(foc[s])+' ('+Math.round(foc[s]/Math.max(1,total)*100)+'%)"><span class="tr-bl">'+s+'</span><span class="tr-bt"><i style="width:'+Math.max(1.5,foc[s]/mx*100).toFixed(1)+'%"></i></span><span class="tr-bv">'+trDur(foc[s])+'</span></div>').join('')+'</div>';
  /* time per day (or per month for the year view) */
  const byMonth=tr.range==='year',bk={};Object.keys(perDay).forEach(dy=>{const k=byMonth?dy.slice(0,7):dy;bk[k]=(bk[k]||0)+perDay[dy];});
  const keys=Object.keys(bk).sort().slice(-31),cm=Math.max(1,...keys.map(k=>bk[k])),CW=640,CH=150,bw=Math.min(34,(CW-40)/Math.max(1,keys.length)-2);
  let col='';
  if(keys.length>1){col='<h4 style="margin-top:18px">Time per '+(byMonth?'month':'day')+'</h4><svg viewBox="0 0 '+CW+' '+(CH+26)+'" class="tr-svg" role="img" aria-label="Time in the app per '+(byMonth?'month':'day')+'"><path d="M30 '+CH+'H'+CW+'" stroke="#C9D2D8"/><text x="34" y="10" font-size="10" fill="#5A6B78">Tallest bar: '+trDur(cm)+'</text>';
    const step=Math.ceil(keys.length/8);
    keys.forEach((k,i)=>{const x=34+i*((CW-40)/keys.length),hh=Math.max(2,bk[k]/cm*(CH-18)),lab=byMonth?new Date(+k.slice(0,4),+k.slice(5,7)-1,1).toLocaleDateString([], {month:'short'}):trNice(k);
      col+='<path d="M'+x+' '+CH+'v'+(-hh+4)+'q0 -4 4 -4h'+(bw-8)+'q4 0 4 4v'+(hh-4)+'z" fill="#0E7C6B"><title>'+lab+': '+trDur(bk[k])+'</title></path>'+(i%step===0?'<text x="'+(x+bw/2)+'" y="'+(CH+16)+'" text-anchor="middle" font-size="10" fill="#5A6B78">'+lab+'</text>':'');});
    col+='</svg>';}
  h+='<div class="card tr-card"><h4>Where the time goes</h4><p class="muted tr-sub">Time spent in each section, most first.</p>'+(secs.length?bars:'<p class="muted">No focus time yet.</p>')+col+'</div></div></section>';
  return h;
}

/* ─────────── actions ─────────── */

render();
