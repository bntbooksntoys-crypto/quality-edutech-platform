/* Generate deterministic attendance calendar for last 90 days */
function prAttDays(from, to){
  const out=[]; let d=new Date(from);
  const absent=[3,11,19,28,42,57,63,78]; // fixed absent indices
  let idx=0;
  while(d<=to){
    const dow=d.getDay();
    if(dow>0&&dow<6){ // Mon–Fri only
      out.push({date:new Date(d), present:!absent.includes(idx)});
      idx++;
    }
    d.setDate(d.getDate()+1);
  }
  return out;
}

function prDateRange(){
  const now=new Date('2026-09-29'); // use today
  const r=state.pr.range;
  let from=new Date(now), to=new Date(now);
  if(r==='week'){ from.setDate(now.getDate()-6); }
  else if(r==='month'){ from.setDate(now.getDate()-29); }
  else if(r==='year'){ from=new Date(now.getFullYear(),0,1); }
  else if(r==='custom'){
    from=state.pr.customFrom?new Date(state.pr.customFrom):new Date(now.getFullYear(),0,1);
    to=state.pr.customTo?new Date(state.pr.customTo):now;
  }
  return {from,to};
}

/* ─────────── Quiz view ─────────── */
function saveQz(){try{localStorage.setItem('qe_qz',JSON.stringify(state.qz));}catch(e){}}
function quizView(){
  const t=T(), qz=state.qz;
  if(!qz.grade){
    const m=String((state.user&&state.user.grade)||'8').match(/\d+/);
    qz.grade=m?String(parseInt(m[0])):'8'; saveQz();
  }
  const gradeData=(window.QUIZZES||{})[qz.grade]||{};
  const subjects=Object.keys(gradeData);
  /* Subject picker */
  if(!qz.subject||!qz.active){
    const subjCards=subjects.map(s=>{
      const qs=gradeData[s], prefix=qz.grade+'|'+s+'|';
      const attempted=Object.keys(qz.answers).filter(k=>k.startsWith(prefix)).length;
      const cCount=Object.entries(qz.answers).filter(([k,v])=>k.startsWith(prefix)&&v===true).length;
      const done=attempted>=10;
      const pct=done?Math.round(cCount/10*100):null;
      return card(
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'+
        '<span style="font-size:15px;font-weight:600">'+s+'</span>'+
        (done?'<span style="font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:'+(pct>=60?'var(--tealSoft)':'var(--redSoft)')+';color:'+(pct>=60?'var(--teal)':'var(--vermilion)')+'">'+pct+'%</span>':
          (attempted>0?'<span style="font-size:12px;color:var(--slate)">'+attempted+'/10</span>':'<span style="font-size:11px;padding:2px 8px;border-radius:20px;background:var(--canvas);color:var(--slate)">Not started</span>'))+
        '</div>'+
        '<div style="font-size:12px;color:var(--slate);margin-bottom:10px">'+qs.book+' · 10 questions</div>'+
        '<div style="display:flex;gap:5px;margin-bottom:12px">'+

function qzStart(s){
  const qz=state.qz;
  const questions=(((window.QUIZZES||{})[qz.grade]||{})[s]||{}).questions||[];
  // If all 10 answered → retake (clear answers for this subject)
  const prefix=qz.grade+'|'+s+'|';
  const attempted=Object.keys(qz.answers).filter(k=>k.startsWith(prefix)).length;
  if(attempted>=questions.length){
    Object.keys(qz.answers).forEach(k=>{if(k.startsWith(prefix))delete qz.answers[k];});
  }
  // Find first unanswered
  let startI=0;
  for(let i=0;i<questions.length;i++){if(qz.answers[prefix+i]===undefined){startI=i;break;}}
  qz.subject=s; qz.active=true; qz.i=startI; qz.picked=null;
  saveQz(); render(); window.scrollTo(0,0);
}
function qzBack(){state.qz.active=false;state.qz.picked=null;saveQz();render();window.scrollTo(0,0);}
function qzPick(n){if(state.qz.answers[state.qz.grade+'|'+state.qz.subject+'|'+state.qz.i]!==undefined)return;state.qz.picked=n;render();}
function qzCheck(){
  const qz=state.qz;
  if(qz.picked===null)return;
  const question=(((window.QUIZZES||{})[qz.grade]||{})[qz.subject]||{questions:[]}).questions[qz.i];
  if(!question)return;
  qz.answers[qz.grade+'|'+qz.subject+'|'+qz.i]=(question.ans===['A','B','C','D'][qz.picked]);
  saveQz(); render();
}
function qzNext(){state.qz.picked=null;state.qz.i++;saveQz();render();window.scrollTo(0,0);}
function qzFinish(){
  const qz=state.qz;
  if(qz.picked!==null&&qz.answers[qz.grade+'|'+qz.subject+'|'+qz.i]===undefined){
    const question=(((window.QUIZZES||{})[qz.grade]||{})[qz.subject]||{questions:[]}).questions[qz.i];
    if(question) qz.answers[qz.grade+'|'+qz.subject+'|'+qz.i]=(question.ans===['A','B','C','D'][qz.picked]);
  }
  qz.active=false; qz.subject=null; qz.picked=null;
  saveQz(); render(); window.scrollTo(0,0);
}

/* quiz */
function aiSubjects(){return Object.keys((window.QUIZZES||{})[aiGrade()]||{});}
function aiQuizAsk(){
  const subs=aiSubjects();
  if(!subs.length){aiSay('The quiz questions are not loaded yet. Check the internet connection and try again.',aiMenu());return;}
  aiSay('Which subject do you want a quiz on? Grade '+aiEsc(aiGrade())+' has these.',subs.map((s,i)=>[s,'sub:'+i]));
}
function aiQuizStart(sub){
  const g=aiGrade(),all=((((window.QUIZZES||{})[g]||{})[sub]||{}).questions)||[];
  if(!all.length){aiSay('There are no questions for that subject yet.',aiMenu());return;}
  const idx=all.map((_,i)=>i),fresh=idx.filter(i=>state.qz.answers[g+'|'+sub+'|'+i]===undefined),pool=(fresh.length>=5?fresh:idx).slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t;}
  ai.quiz={g:g,sub:sub,list:pool.slice(0,5),n:0,right:0};
  aiSay('Here is a 5-question quiz on <b>'+aiEsc(sub)+'</b>. Pick the right answer.');
  aiQuizNext();
}
function aiQuizNext(){
  const z=ai.quiz,q=window.QUIZZES[z.g][z.sub].questions[z.list[z.n]];
  aiSay('<span class="ai-tag">Question '+(z.n+1)+' of '+z.list.length+(q.topic?' · '+aiEsc(q.topic):'')+'</span><b>'+aiEsc(q.q)+'</b>',
    ['a','b','c','d'].filter(k=>q[k]!=null&&q[k]!=='').map(k=>[k.toUpperCase()+'. '+q[k],'ans:'+k.toUpperCase()]));
}
function aiQuizAnswer(letter){
  const z=ai.quiz;if(!z)return;const i=z.list[z.n],q=window.QUIZZES[z.g][z.sub].questions[i],ok=q.ans===letter;
  state.qz.answers[z.g+'|'+z.sub+'|'+i]=ok;saveQz();if(ok)z.right++;
  const right=q[String(q.ans||'').toLowerCase()];
  aiSay((ok?'<b class="ai-ok">Correct.</b> ':'<b class="ai-no">Not quite.</b> The answer is <b>'+aiEsc(q.ans)+'. '+aiEsc(right)+'</b>. ')+aiEsc(q.exp||''));
  z.n++;
  if(z.n<z.list.length){aiQuizNext();return;}
  if(z.teach){ai.quiz=null;aiSay(ok?'Well done. Shall we go on?':'Read the explanation once more, then try again or move on.',[['Another question','teachq'],['Next topic','teachnext'],['Progress Report','progress']]);return;}
  const pct=Math.round(z.right/z.list.length*100);ai.quiz=null;
  aiSay('Quiz finished. You scored <b>'+z.right+' out of '+z.list.length+'</b> ('+pct+'%) in '+aiEsc(z.sub)+'. '+(pct>=80?'Excellent work.':pct>=50?'Good effort. One more round will make it stronger.':'Keep practising. Read the explanations above, then try again.'),
    [['Another quiz','quiz'],['Progress Report','progress'],['Achievements','awards']]);
}

/* numbers used by the report and the achievements */
function aiStats(){
  const g=aiGrade(),by={};let total=0,right=0;
  Object.keys(state.qz.answers||{}).forEach(k=>{const p=k.split('|');if(p.length<3)return;const o=by[p[1]]||(by[p[1]]={n:0,r:0});o.n++;total++;if(state.qz.answers[k]===true){o.r++;right++;}});
  const u=String((state.user&&state.user.email)||'').toLowerCase(),d=qtLoad(),wk=qtDay(Date.now()-6*864e5);
  const ses=d.s.filter(s=>s.u===u),days={},foc={};let secWeek=0,secAll=0;
  ses.forEach(s=>{days[qtDay(s.in)]=1;});
  Object.keys(d.f).forEach(k=>{const i=k.lastIndexOf('|');if(k.slice(0,i)!==u)return;const day=k.slice(i+1);Object.keys(d.f[k]).forEach(x=>{secAll+=d.f[k][x];if(day>=wk){secWeek+=d.f[k][x];foc[x]=(foc[x]||0)+d.f[k][x];}});});
  let stars=0;try{const r=rbDone();stars=Object.keys(r).reduce((a,k)=>a+(r[k]||0),0);}catch(e){}
  let parts=0;try{const c=JSON.parse(localStorage.getItem('qe_circuit')||'null');parts=c&&Array.isArray(c.parts)?c.parts.length:0;}catch(e){}
  return {by:by,total:total,right:right,sesWeek:ses.filter(s=>qtDay(s.in)>=wk).length,days:Object.keys(days).length,foc:foc,secWeek:secWeek,secAll:secAll,stars:stars,parts:parts};
}
function aiProgress(){
  const s=aiStats(),subs=Object.keys(s.by).filter(k=>s.by[k].n>=3).sort((a,b)=>s.by[b].r/s.by[b].n-s.by[a].r/s.by[a].n);
  const top=Object.keys(s.foc).sort((a,b)=>s.foc[b]-s.foc[a]);
  let h='<b>Your progress report</b><div class="ai-grid">'+
    '<div><b>'+trDur(s.secWeek)+'</b><span>Time this week</span></div><div><b>'+s.sesWeek+'</b><span>Logins this week</span></div>'+
    '<div><b>'+(s.total?Math.round(s.right/s.total*100)+'%':'—')+'</b><span>Quiz accuracy</span></div><div><b>'+s.total+'</b><span>Questions answered</span></div></div>';
  if(top.length)h+='<p>You spent the most time on <b>'+aiEsc(top[0])+'</b> ('+trDur(s.foc[top[0]])+')'+(top[1]?', then '+aiEsc(top[1]):'')+'.</p>';
  if(Object.keys(s.by).length)h+='<div class="ai-list">'+Object.keys(s.by).sort().map(k=>{const o=s.by[k],p=Math.round(o.r/o.n*100);return '<div><span>'+aiEsc(k)+'</span><i><u style="width:'+Math.max(3,p)+'%"></u></i><em>'+o.r+'/'+o.n+'</em></div>';}).join('')+'</div>';
  if(subs.length>=2)h+='<p>Strongest subject: <b>'+aiEsc(subs[0])+'</b>. Needs more practice: <b>'+aiEsc(subs[subs.length-1])+'</b>.</p>';
  else if(!s.total)h+='<p>You have not answered any quiz questions yet. Take a quiz and your subject scores will appear here.</p>';

  chips.push(['Achievements','awards']);

   ['Quiz explorer','Answer 25 quiz questions',s.total>=25,s.total+' of 25'],

/* teaching: lessons by grade, chosen from the progress report */
function aiWeakSubject(){const s=aiStats(),subs=aiSubjects().filter(k=>s.by[k]&&s.by[k].n>=3).sort((a,b)=>s.by[a].r/s.by[a].n-s.by[b].r/s.by[b].n);return subs.length&&s.by[subs[0]].r/s.by[subs[0]].n<0.8?subs[0]:null;}
function aiTeachAsk(){
  const subs=aiSubjects();if(!subs.length){aiSay('The lessons are not loaded yet. Check the internet connection and try again.',aiMenu());return;}
  const weak=aiWeakSubject(),order=weak?[weak].concat(subs.filter(s=>s!==weak)):subs;
  aiSay((weak?'Your progress report shows that <b>'+aiEsc(weak)+'</b> needs the most practice, so I suggest we start there. ':'I will teach from your Grade '+aiEsc(aiGrade())+' topics. ')+'Which subject shall we learn?',
    order.map(s=>[s===weak?s+' (suggested)':s,'teach:'+subs.indexOf(s)]));
}
function aiTeachStart(sub,skip){
  const g=aiGrade(),qs=((((window.QUIZZES||{})[g]||{})[sub]||{}).questions)||[];
  if(!qs.length){aiSay('There are no lessons for that subject yet.',aiMenu());return;}
  const topics={};qs.forEach((q,i)=>{const t=q.topic||'General';(topics[t]=topics[t]||{idx:[],wrong:0,done:0}).idx.push(i);const a=state.qz.answers[g+'|'+sub+'|'+i];if(a===false)topics[t].wrong++;if(a!==undefined)topics[t].done++;});
  const seen=(ai.teach&&ai.teach.sub===sub&&skip)?ai.teach.seen:[];
  let names=Object.keys(topics).filter(t=>seen.indexOf(t)<0);if(!names.length){names=Object.keys(topics);seen.length=0;}
  names.sort((a,b)=>(topics[b].wrong-topics[a].wrong)||(topics[a].done/topics[a].idx.length-topics[b].done/topics[b].idx.length));
  const topic=names[0],T=topics[topic];seen.push(topic);ai.quiz=null;ai.teach={g:g,sub:sub,topic:topic,idx:T.idx,seen:seen};
  const pts=T.idx.slice(0,3).map(i=>{const q=qs[i],ans=q[String(q.ans||'').toLowerCase()];return '<li><b>'+aiEsc(ans)+'</b>'+(q.exp?' — '+aiEsc(q.exp):'')+'</li>';}).join('');
  aiSay('<span class="ai-tag">Grade '+aiEsc(g)+' · '+aiEsc(sub)+'</span>Let us learn <b>'+aiEsc(topic)+'</b>.'+(T.wrong?' You missed a question here before, so read these carefully.':'')+
    '<ul class="ai-pts">'+pts+'</ul>Read the points, then try a question.',[['Practice question','teachq'],['Next topic','teachnext'],['Change subject','teach']]);
}
function aiTeachQuestion(){
  const t=ai.teach;if(!t){aiTeachAsk();return;}
  const fresh=t.idx.filter(i=>state.qz.answers[t.g+'|'+t.sub+'|'+i]!==true),pool=fresh.length?fresh:t.idx,i=pool[Math.floor(Math.random()*pool.length)];
  ai.quiz={g:t.g,sub:t.sub,list:[i],n:0,right:0,teach:true};aiQuizNext();
}

/* voice: the student can speak, and the assistant can read its replies aloud */
ai.voice=(function(){try{return localStorage.getItem('qe_ai_voice')==='1';}catch(e){return false;}})();
function aiPlain(m){const d=document.createElement('div');d.innerHTML=m.html.replace(/<\/(li|p|div|span)>/g,'. ').replace(/<br\s*\/?>/g,'. ');let t=d.textContent||'';
  if(m.chips&&m.chips.some(c=>c[1].indexOf('ans:')===0))t+='. Options: '+m.chips.map(c=>c[0]).join('. ');return t.replace(/\s+/g,' ').replace(/★/g,'star ').replace(/☆/g,'').trim();}
function aiSpeak(text){
  if(!ai.voice||!('speechSynthesis' in window)||!text)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.slice(0,900));u.lang='en-IN';u.rate=0.95;
    const v=speechSynthesis.getVoices().find(x=>/en[-_]IN/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}

    'no-speech':'I did not hear anything. Tap the microphone and speak again.','network':'Voice typing needs an internet connection.','audio-capture':'No microphone was found on this device.'}[e.error];if(m){aiSay(m);aiPaint();}};

function aiDo(cmd,label){
  if(ai.busy)return;
  if(label)aiMe(label);
  aiReply(()=>{
    if(cmd==='quiz'){ai.quiz=null;aiQuizAsk();}
    else if(cmd==='teach'){ai.quiz=null;aiTeachAsk();}
    else if(cmd==='teachq'){aiTeachQuestion();}
    else if(cmd==='teachnext'){if(ai.teach)aiTeachStart(ai.teach.sub,true);else aiTeachAsk();}
    else if(cmd.indexOf('teach:')===0){const s=aiSubjects()[Number(cmd.slice(6))];if(s)aiTeachStart(s);else aiTeachAsk();}
    else if(cmd==='progress'){ai.quiz=null;aiProgress();}
    else if(cmd==='awards'){ai.quiz=null;aiAwards();}
    else if(cmd.indexOf('sub:')===0){const s=aiSubjects()[Number(cmd.slice(4))];if(s)aiQuizStart(s);else aiQuizAsk();}
    else if(cmd.indexOf('ans:')===0){if(ai.quiz)aiQuizAnswer(cmd.slice(4));else aiSay('That quiz has ended. Start a new one?',aiMenu());}
    else if(cmd.indexOf('open:')===0){const v=cmd.slice(5);if(v==='progress'||v==='awards'||v==='quiz'){go(v);return;}}
    else aiSay('I can help with these.',aiMenu());
  });
}
function aiSend(ev){ev.preventDefault();const el=document.getElementById('aiIn'),text=(el.value||'').trim();if(!text)return false;el.value='';aiSendText(text);return false;}
function aiSendText(text){
  if(ai.busy)return;
  const t=text.toLowerCase().replace(/[.!?]+$/,'');aiMe(text);
  aiReply(()=>{
    if(ai.quiz){const m=t.match(/^\s*(?:option\s*|answer\s*)?(a|b|c|d|ay|bee|be|see|sea|dee)\b/);if(m){aiQuizAnswer({a:'A',ay:'A',b:'B',bee:'B',be:'B',c:'C',see:'C',sea:'C',d:'D',dee:'D'}[m[1]]);return;}}
    const subs=aiSubjects(),hit=subs.slice().sort((a,b)=>b.length-a.length).find(s=>t.indexOf(s.toLowerCase())>=0);
    if(/teach|learn|explain|lesson|study|revise/.test(t)){ai.quiz=null;if(hit)aiTeachStart(hit);else aiTeachAsk();}
    else if(/next topic/.test(t)&&ai.teach){aiTeachStart(ai.teach.sub,true);}
    else if(/quiz|test|question|practi[cs]e/.test(t)||hit){ai.quiz=null;if(hit)aiQuizStart(hit);else aiQuizAsk();}
    else if(/progress|report|time|trend|score|how am i|doing/.test(t)){ai.quiz=null;aiProgress();}
    else if(/achiev|badge|award|star|medal|trophy/.test(t)){ai.quiz=null;aiAwards();}
    else if(/^(hi|hello|hey|vanakkam|namaste)\b/.test(t))aiSay('Hello '+aiEsc(aiName())+'! Pick one and we will start.',aiMenu());
    else if(/thank/.test(t))aiSay('You are welcome. Anything else?',aiMenu());
    else if(ai.quiz)aiSay('Please answer with A, B, C or D, or tap one of the options.',['a','b','c','d'].map(k=>[k.toUpperCase(),'ans:'+k.toUpperCase()]));
    else aiSay('I can teach a topic, run a quiz, show your progress report or list your achievements. Say or type one of those, or tap a button.',aiMenu());
  });
}

/* accounts kept online (Google Sheet through the Apps Script), so one account works on every device */
async function qeCloud(action,data){
  const url=window.QE_REPORT_URL;if(!url||!/^https:\/\/script\.google\.com\//.test(url))return null;
  try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),15000);
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',signal:ctl.signal,body:JSON.stringify(Object.assign({key:window.QE_REPORT_KEY||'',action:action},data))});
    clearTimeout(tm);return await r.json();}catch(e){return null;}
}
async function doSignIn(e){
  e.preventDefault();
  const email=document.getElementById('f_email').value.trim().toLowerCase();
  const password=document.getElementById('f_pass').value;
  state.auth.error=''; state.auth.loading=true; render();
  try {
    const pwHash = await sha256(password);
    const users = getUsers();
    let user = users.find(u=>u.email===email && u.passwordHash===pwHash);
    if(user){ qeCloud('register',{email:user.email,name:user.name,grade:user.grade,age:user.age,hash:pwHash}); }   /* copies an older account online, in the background */
    else{
      const res = await qeCloud('login',{email:email,hash:pwHash});
      if(res&&res.ok&&res.user){
        user={name:res.user.name,email:email,passwordHash:pwHash,grade:res.user.grade,age:Number(res.user.age)||'',createdAt:new Date().toISOString()};
        saveUsers(users.filter(u=>u.email!==email).concat([user]));
      }else{
        qeLog('failed',{email:email});
        if(res&&res.error==='wait') throw new Error('Too many tries. Wait 10 minutes and try again.');
        if(!res&&!users.find(u=>u.email===email)) throw new Error('This account is not on this device yet. Connect to the internet and try again.');
        throw new Error('Incorrect email or password.');
      }
    }
    const userData = {name:user.name,email:user.email,grade:user.grade,age:user.age};
    localStorage.setItem('qe_token','local-'+Date.now());
    localStorage.setItem('qe_user',JSON.stringify(userData));
    state.user = userData; qeLog('signin',userData); setTimeout(qtBeat,50);
    const _gm1=String(userData.grade).match(/\d+/); state.libGrade=_gm1?parseInt(_gm1[0])||8:8;
    state.auth = {screen:'app',error:'',loading:false};
    render();
  } catch(err){
    state.auth.error = err.message;
    state.auth.loading = false;
    render();
  }
}

async function doSignUp(e){
  e.preventDefault();
  const name=document.getElementById('f_name').value.trim();
  const email=document.getElementById('f_email').value.trim().toLowerCase();
  const password=document.getElementById('f_pass').value;
  const grade=document.getElementById('f_grade').value;
  const age=document.getElementById('f_age').value;
  if(password.length<6){state.auth.error='Password must be at least 6 characters.';render();return;}
  state.auth.error=''; state.auth.loading=true; render();
  try {
    const users = getUsers();
    if(users.find(u=>u.email===email)) throw new Error('An account with this email already exists.');
    const pwHash = await sha256(password);
    const res = await qeCloud('register',{email:email,name:name,grade:grade,age:Number(age),hash:pwHash});
    if(res&&res.error==='exists') throw new Error('An account with this email already exists. Sign in instead.');
    users.push({name,email,passwordHash:pwHash,grade,age:Number(age),createdAt:new Date().toISOString()});
    saveUsers(users);
    const userData = {name,email,grade,age:Number(age)};
    localStorage.setItem('qe_token','local-'+Date.now());
    localStorage.setItem('qe_user',JSON.stringify(userData));
    state.user = userData; qeLog('signup',userData); setTimeout(qtBeat,50);
    const _gm2=String(grade).match(/\d+/); state.libGrade=_gm2?parseInt(_gm2[0])||8:8;
    state.auth = {screen:'app',error:'',loading:false};
    render();
  } catch(err){
    state.auth.error = err.message;
    state.auth.loading = false;
    render();
  }
}

function doSignOut(){
  qtEnd();
  qeLog('signout',state.user);
  localStorage.removeItem('qe_token');
  localStorage.removeItem('qe_user');
  state.user = null;
  state.auth = {screen:'signin',error:'',loading:false};
  render();
}

/* ─────────── Real activity tracking + Trend analysis ─────────── */
const QT_KEY='qe_activity', QT_TICK=5;
const QT_NAMES={home:'Home',learn:'Learn',live:'Live classes',assess:'Assignment',quiz:'Quiz',progress:'Progress Report',awards:'Achievements',lab:'Lab',ai:'AI Assistant'};
let qt={cur:null,lastSync:0};
function qtLoad(){try{const d=JSON.parse(localStorage.getItem(QT_KEY)||'null');if(d&&Array.isArray(d.s)&&d.f)return d;}catch(e){}return {s:[],f:{}};}
function qtStore(d){try{if(d.s.length>2000)d.s=d.s.slice(-2000);localStorage.setItem(QT_KEY,JSON.stringify(d));}catch(e){}}
function qtDay(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function qtUser(){return state.user&&state.auth.screen==='app'?String(state.user.email||'').toLowerCase():'';}
function qtSection(){
  if(state.view==='lab'&&state.labOpen){const l=(typeof LABS!=='undefined')&&LABS.find(x=>x.id===state.labOpen);return l?l.title:'Lab';}
  return state.view==='games'?'Games':(QT_NAMES[state.view]||'Other');
}
function qtBeat(){
  const u=qtUser();if(!u){qt.cur=null;return;}
  if(document.visibilityState!=='visible')return;
  const d=qtLoad(),now=Date.now();
  if(!qt.cur||qt.cur.u!==u){qt.cur={id:now.toString(36)+Math.random().toString(36).slice(2,7),u:u,in:now,out:now};d.s.push(qt.cur);}
  else{const s=d.s.find(x=>x.id===qt.cur.id);if(s){s.out=now;qt.cur=s;}else{qt.cur.out=now;d.s.push(qt.cur);}
    const k=u+'|'+qtDay(now),sec=qtSection();d.f[k]=d.f[k]||{};d.f[k][sec]=(d.f[k][sec]||0)+QT_TICK;}
  qtStore(d);
  if(now-qt.lastSync>60000)qtSync();
}
function qtEnd(){const u=qtUser();if(qt.cur&&u){const d=qtLoad(),s=d.s.find(x=>x.id===qt.cur.id);if(s){s.out=Date.now();qtStore(d);}qtSync();}qt.cur=null;}
function qtSync(){
  qt.lastSync=Date.now();
  try{
    if(!qt.cur||!state.user)return;
    const d=qtLoad(),day=qtDay(Date.now()),s=d.s.find(x=>x.id===qt.cur.id)||qt.cur;
    const data={email:qt.cur.u,name:state.user.name||'',grade:state.user.grade||'',age:state.user.age||'',session:{id:s.id,in:s.in,out:s.out},date:day,focus:d.f[qt.cur.u+'|'+day]||{}};
    /* school server on the local network */
    if(/^(localhost|127\.|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname))
      fetch('/api/activity',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify(data)}).catch(function(){});
    /* Google Sheet for the weekly email report (set in report-config.js) */
    if(window.QE_REPORT_URL&&/^https:\/\/script\.google\.com\//.test(window.QE_REPORT_URL))
      fetch(window.QE_REPORT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},keepalive:true,body:JSON.stringify(Object.assign({key:window.QE_REPORT_KEY||''},data))}).catch(function(){});
  }catch(e){}
}
setInterval(qtBeat,QT_TICK*1000);
setTimeout(qtBeat,400);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')qtSync();else qtBeat();});
window.addEventListener('pagehide',qtSync);

/* ── Trend analysis (reads the real records above) ── */
let tr={range:'day',from:'',to:''};
function trRange(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),today=qtDay(n.getTime());
  if(tr.range==='month')return [qtDay(new Date(y,m,1).getTime()),today];
  if(tr.range==='year')return [y+'-01-01',today];
  if(tr.range==='custom'){let a=tr.from||today,b=tr.to||today;if(a>b){const t=a;a=b;b=t;}return [a,b];}
  return [today,today];
}
function trSet(r){tr.range=r;if(r==='custom'&&!tr.from){const t=qtDay(Date.now());tr.from=qtDay(Date.now()-6*864e5);tr.to=t;}render();}
function trDate(f,v){tr[f]=v;render();}
function trDur(sec){sec=Math.round(sec);if(sec<60)return sec+' s';const m=Math.round(sec/60);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min';}
function trClock(ts){return new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}
function trNice(day){const p=day.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString([], {day:'numeric',month:'short'});}
function trendHTML(){
  if(!state.user)return '';
  const u=String(state.user.email||'').toLowerCase(),d=qtLoad(),rg=trRange(),from=rg[0],to=rg[1];
  const ses=d.s.filter(s=>s.u===u&&qtDay(s.in)>=from&&qtDay(s.in)<=to).sort((a,b)=>b.in-a.in);
  const foc={},perDay={};
  Object.keys(d.f).forEach(k=>{const i=k.lastIndexOf('|'),ku=k.slice(0,i),day=k.slice(i+1);if(ku!==u||day<from||day>to)return;
    Object.keys(d.f[k]).forEach(sec=>{foc[sec]=(foc[sec]||0)+d.f[k][sec];perDay[day]=(perDay[day]||0)+d.f[k][sec];});});
  const total=Object.values(foc).reduce((a,b)=>a+b,0),secs=Object.keys(foc).sort((a,b)=>foc[b]-foc[a]);
  const avg=ses.length?ses.reduce((a,s)=>a+(s.out-s.in)/1000,0)/ses.length:0;
  const hrs=ses.map(s=>{const t=new Date(s.in);return t.getHours()*60+t.getMinutes();}).sort((a,b)=>a-b),med=hrs.length?hrs[Math.floor(hrs.length/2)]:null;
  const usual=med===null?'—':new Date(2000,0,1,Math.floor(med/60),med%60).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  const pill=(k,l)=>'<button class="tr-pill'+(tr.range===k?' on':'')+'" onclick="trSet(\''+k+'\')">'+l+'</button>';
  const tile=(v,l)=>'<div class="tr-tile"><b>'+v+'</b><span>'+l+'</span></div>';
  let h='<section class="tr-wrap"><div class="tr-head"><div>'+eyebrow('Real activity on this device')+'<h3 class="display" style="font-size:22px">Trend analysis</h3></div>'+
    '<div class="tr-filter" role="group" aria-label="Time range">'+pill('day','Today')+pill('month','This month')+pill('year','This year')+pill('custom','Custom')+
    (tr.range==='custom'?'<input type="date" aria-label="From date" value="'+tr.from+'" max="'+qtDay(Date.now())+'" onchange="trDate(\'from\',this.value)"><span class="muted">to</span><input type="date" aria-label="To date" value="'+tr.to+'" max="'+qtDay(Date.now())+'" onchange="trDate(\'to\',this.value)">':'')+'</div></div>'+
    '<div class="tr-tiles">'+tile(trDur(total),'Time in the app')+tile(ses.length,'Logins')+tile(ses.length?trDur(avg):'—','Average session')+tile(secs[0]||'—','Most focus')+tile(usual,'Usual login time')+'</div>';
  if(!ses.length&&!total)return h+'<div class="card tr-card"><p class="muted">No activity is recorded for this range yet. Keep using the app and it will appear here.</p></div></section>';
  /* use 1: login and logout */
  const days=[];ses.forEach(s=>{const dy=qtDay(s.in);if(days.indexOf(dy)<0)days.push(dy);});
  const rows=days.slice(0,14),RW=640,L=62,PW=RW-L-10,RH=22;
  let tl='<svg viewBox="0 0 '+RW+' '+(rows.length*RH+28)+'" class="tr-svg" role="img" aria-label="Login and logout times by day"><g font-size="10" fill="#5A6B78">';
  [0,6,12,18,24].forEach(hh=>{const x=L+hh/24*PW;tl+='<path d="M'+x+' 4V'+(rows.length*RH+6)+'" stroke="#E3E9EC"/><text x="'+x+'" y="'+(rows.length*RH+20)+'" text-anchor="middle">'+(hh===0||hh===24?'12 am':hh===12?'12 pm':hh<12?hh+' am':(hh-12)+' pm')+'</text>';});
  rows.forEach((dy,i)=>{const y=6+i*RH;tl+='<text x="'+(L-8)+'" y="'+(y+13)+'" text-anchor="end">'+trNice(dy)+'</text>';
    ses.filter(s=>qtDay(s.in)===dy).forEach(s=>{const a=new Date(s.in),b=new Date(Math.max(s.out,s.in)),x1=L+(a.getHours()*60+a.getMinutes())/1440*PW,e=qtDay(b.getTime())===dy?(b.getHours()*60+b.getMinutes())/1440:1,w=Math.max(4,L+e*PW-x1);
      tl+='<rect x="'+x1.toFixed(1)+'" y="'+(y+3)+'" width="'+w.toFixed(1)+'" height="'+(RH-8)+'" rx="4" fill="#0E7C6B"><title>'+trNice(dy)+': login '+trClock(s.in)+', logout '+trClock(s.out)+' ('+trDur((s.out-s.in)/1000)+')</title></rect>';});});
  tl+='</g></svg>';
  h+='<div class="tr-two"><div class="card tr-card"><h4>Login and logout times</h4><p class="muted tr-sub">Each bar runs from login to logout.'+(days.length>14?' Showing the latest 14 days.':'')+'</p>'+tl+
    '<div class="tr-tablewrap"><table class="tr-table"><thead><tr><th>Date</th><th>Login</th><th>Logout</th><th>Time spent</th></tr></thead><tbody>'+
    ses.slice(0,60).map(s=>'<tr><td>'+trNice(qtDay(s.in))+'</td><td>'+trClock(s.in)+'</td><td>'+(qt.cur&&qt.cur.id===s.id?'Active now':trClock(s.out))+'</td><td>'+trDur((s.out-s.in)/1000)+'</td></tr>').join('')+'</tbody></table></div></div>';
  /* use 2: focus */
  const mx=Math.max(1,...secs.map(s=>foc[s]));
  let bars='<div class="tr-bars" role="list">'+secs.map(s=>'<div class="tr-bar" role="listitem" title="'+s+': '+trDur(foc[s])+' ('+Math.round(foc[s]/Math.max(1,total)*100)+'%)"><span class="tr-bl">'+s+'</span><span class="tr-bt"><i style="width:'+Math.max(1.5,foc[s]/mx*100).toFixed(1)+'%"></i></span><span class="tr-bv">'+trDur(foc[s])+'</span></div>').join('')+'</div>';
  /* time per day (or per month for the year view) */
  const byMonth=tr.range==='year',bk={};Object.keys(perDay).forEach(dy=>{const k=byMonth?dy.slice(0,7):dy;bk[k]=(bk[k]||0)+perDay[dy];});
  const keys=Object.keys(bk).sort().slice(-31),cm=Math.max(1,...keys.map(k=>bk[k])),CW=640,CH=150,bw=Math.min(34,(CW-40)/Math.max(1,keys.length)-2);
  let col='';
  if(keys.length>1){col='<h4 style="margin-top:18px">Time per '+(byMonth?'month':'day')+'</h4><svg viewBox="0 0 '+CW+' '+(CH+26)+'" class="tr-svg" role="img" aria-label="Time in the app per '+(byMonth?'month':'day')+'"><path d="M30 '+CH+'H'+CW+'" stroke="#C9D2D8"/><text x="34" y="10" font-size="10" fill="#5A6B78">Tallest bar: '+trDur(cm)+'</text>';
    const step=Math.ceil(keys.length/8);
    keys.forEach((k,i)=>{const x=34+i*((CW-40)/keys.length),hh=Math.max(2,bk[k]/cm*(CH-18)),lab=byMonth?new Date(+k.slice(0,4),+k.slice(5,7)-1,1).toLocaleDateString([], {month:'short'}):trNice(k);
      col+='<path d="M'+x+' '+CH+'v'+(-hh+4)+'q0 -4 4 -4h'+(bw-8)+'q4 0 4 4v'+(hh-4)+'z" fill="#0E7C6B"><title>'+lab+': '+trDur(bk[k])+'</title></path>'+(i%step===0?'<text x="'+(x+bw/2)+'" y="'+(CH+16)+'" text-anchor="middle" font-size="10" fill="#5A6B78">'+lab+'</text>':'');});
    col+='</svg>';}
  h+='<div class="card tr-card"><h4>Where the time goes</h4><p class="muted tr-sub">Time spent in each section, most first.</p>'+(secs.length?bars:'<p class="muted">No focus time yet.</p>')+col+'</div></div></section>';
  return h;
}

/* ─────────── actions ─────────── */
function go(v){if(typeof xrCamStop==='function')xrCamStop();state.view=v;state.navOpen=false;state.labOpen=null;render();window.scrollTo(0,0);}
function setRole(r){state.role=r;state.view="home";render();}
function setLang(l){state.lang=l;render();}
function setFilter(f){state.filter=f;render();}
function toggleNav(){state.navOpen=!state.navOpen;render();}
function toggleLib(){state.libOpen=!state.libOpen;render();}
function toggleNotif(){state.notifOpen=!state.notifOpen;render();}
function setLibGrade(g){state.libGrade=g;render();}
function pick(n){if(state.quiz.answers.length===state.quiz.i+1)return;state.quiz.picked=n;render();}
function checkQ(){const q=state.quiz;if(q.picked===null)return;q.answers.push(q.picked===QUIZ[q.i].a);render();}
function nextQ(){const q=state.quiz;q.picked=null;if(q.i+1<QUIZ.length)q.i++;else q.done=true;render();}
function resetQuiz(){state.quiz={i:0,picked:null,answers:[],done:false};render();}
/* ── Assignment helpers ── */
/* ── Progress report helpers ── */
function prRange(r){if(!state.pr)state.pr={range:'week',customFrom:'',customTo:''};state.pr.range=r;render();}
function prFrom(v){state.pr.customFrom=v;render();}
function prTo(v){state.pr.customTo=v;render();}
/* ── Assignment helpers ── */
function asSub(s,idx){if(!state.assign)state.assign={grade:null,subject:null,showAnswers:false,submitted:{}};state.assign.subject=s;state.assign.showAnswers=false;render();window.scrollTo(0,0);}
function asGrade(g){if(!state.assign)state.assign={grade:null,subject:null,showAnswers:false,submitted:{}};state.assign.grade=String(g);state.assign.subject=null;render();}
function asToggleAns(){state.assign.showAnswers=!state.assign.showAnswers;render();}

render();
</script>
