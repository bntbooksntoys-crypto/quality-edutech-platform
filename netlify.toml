[build]
  publish = "."

[build.processing]
  skip_processing = true

[[redirects]]
  from = "/labs/language"
  to = "/labs/language.html"
  status = 200

[[redirects]]
  from = "/labs/english"
  to = "/labs/english.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "frame-ancestors *"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/labs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
